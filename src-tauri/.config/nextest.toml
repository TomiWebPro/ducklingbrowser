# cargo-nextest default profile for Duckling Browser.
# Run unit tests with: cargo nextest run --lib
# (compiles first via the shared target dir; use
#  `cargo nextest run --lib --no-run` for a build-only check, or run the
#  existing test binary in target/debug/deps directly to skip cargo entirely —
#  see scripts/agent-cargo.ps1 for the timed wrapper and its env knobs)
[profile.default]
# Flag tests slower than this in the summary so new wall-clock sleeps and
# network waits in unit tests get noticed before they land.
slow-timeout = "60s"
# Never abort the whole run on the first failure: one slow/flaky test must
# not hide the signal from the other 500+.
fail-fast = false
