<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none">
  <title>Duckling Browser</title>
  <!-- Body -->
  <ellipse cx="470" cy="600" rx="280" ry="240" fill="#FFB800"/>
  <!-- Body highlight -->
  <ellipse cx="410" cy="540" rx="200" ry="160" fill="#FFD633" opacity="0.6"/>
  <!-- Head -->
  <circle cx="380" cy="300" r="180" fill="#FFC107"/>
  <!-- Head highlight -->
  <circle cx="340" cy="260" r="130" fill="#FFD633" opacity="0.5"/>
  <!-- Eye white -->
  <ellipse cx="320" cy="250" rx="40" ry="50" fill="white"/>
  <!-- Eye pupil -->
  <circle cx="330" cy="245" r="22" fill="#1a1a2e"/>
  <!-- Eye sparkle -->
  <circle cx="338" cy="238" r="7" fill="white"/>
  <!-- Eye sparkle 2 -->
  <circle cx="323" cy="250" r="3" fill="white" opacity="0.5"/>
  <!-- Beak upper -->
  <path d="M480 310 C530 300, 580 320, 590 340 C580 350, 520 348, 480 340 Z" fill="#FF8F00"/>
  <!-- Beak lower -->
  <path d="M480 340 C520 348, 580 350, 590 340 C570 365, 520 370, 480 355 Z" fill="#E65100"/>
  <!-- Beak line -->
  <path d="M480 340 C530 344, 560 344, 590 340" stroke="#BF360C" stroke-width="2" fill="none"/>
  <!-- Nostril -->
  <ellipse cx="530" cy="328" rx="6" ry="4" fill="#E65100" opacity="0.6"/>
  <!-- Wing -->
  <ellipse cx="560" cy="560" rx="160" ry="110" fill="#FFA000" transform="rotate(-15 560 560)"/>
  <!-- Wing highlight -->
  <ellipse cx="540" cy="540" rx="110" ry="70" fill="#FFB300" opacity="0.4" transform="rotate(-15 540 540)"/>
  <!-- Wing feather lines -->
  <path d="M500 590 C560 610, 640 600, 680 570" stroke="#F57C00" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M520 570 C570 590, 630 580, 660 550" stroke="#F57C00" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M540 550 C580 565, 620 560, 640 530" stroke="#F57C00" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Tail -->
  <path d="M700 520 C750 480, 780 510, 760 550 C740 560, 720 550, 700 540 Z" fill="#FF8F00"/>
  <path d="M720 500 C760 460, 790 490, 780 530 C770 540, 750 530, 720 520 Z" fill="#FFA000"/>
  <!-- Water -->
  <path d="M180 780 Q230 750 280 780 Q330 810 380 780 Q430 750 480 780 Q530 810 580 780 Q630 750 680 780 Q730 810 780 780" stroke="#42A5F5" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M160 810 Q210 780 260 810 Q310 840 360 810 Q410 780 460 810 Q510 840 560 810 Q610 780 660 810 Q710 840 760 810" stroke="#1E88E5" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.3"/>
  <!-- Crown/head tuft -->
  <path d="M340 130 C350 100, 370 80, 380 90 C390 80, 400 100, 395 130" fill="#FFC107"/>
  <path d="M355 120 C360 95, 375 85, 380 90" fill="#FFD633" opacity="0.5"/>
  <!-- Cheek blush -->
  <ellipse cx="270" cy="330" rx="30" ry="20" fill="#FF7043" opacity="0.2"/>
</svg>
